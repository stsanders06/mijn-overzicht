{% extends "_layout.html" %}
{% block titel %}{{ titel }}{% endblock %}
{% block inhoud %}
<header class="kop">
  <div>
    <h1>{{ titel }}</h1>
    <p class="lead">Koppel de datum aan het item waar hij bij hoort, bijvoorbeeld een voertuig of document.</p>
  </div>
  <a class="knop rust" href="{{ url_for('datums') }}">Terug</a>
</header>
<form class="kaart" method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="soort">Soort</label>
  <select id="soort" name="soort" required>
    <option value="">Kies</option>
    {% for code, label in DATUM_SOORTEN %}
    <option value="{{ code }}"{% if waarden.soort == code %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <label for="naam">Naam</label>
  <input id="naam" name="naam" value="{{ waarden.naam }}" required>
  <label for="datum">Datum</label>
  <input id="datum" name="datum" type="date" value="{{ waarden.datum }}" required>
  <label for="notitie">Notitie</label>
  <textarea id="notitie" name="notitie">{{ waarden.notitie }}</textarea>
  <p class="acties"><button class="knop" type="submit">Opslaan</button></p>
</form>
{% if koppel_id %}
<form method="post" action="{{ url_for('datum_weg', datum_id=koppel_id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="knop gevaar" type="submit" data-bevestig="Deze datum weghalen?">Weghalen</button>
</form>
{% endif %}
{% include "_gekoppeld.html" %}
{% endblock %}
